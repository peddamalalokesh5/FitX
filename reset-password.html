<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitX - Reset Password</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav>
    <h2 class="logo">
        Fit<span>X</span>
    </h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="workouts.html">Workouts</a>
        <a href="dietplans.html">Diet Plans</a>
        <a href="membership.html">Membership</a>
    </div>

    <a href="login.html">
        <button class="login-btn">Login</button>
    </a>
</nav>


<section class="login-section">

    <div class="login-box">

        <p class="small-title">RESET PASSWORD</p>

        <h1>Reset Your <span>Password</span></h1>

        <p class="login-subtitle">
            Create a new password for your FitX account.
        </p>

        <form id="resetPasswordForm">

            <div class="input-group">
                <label for="newPassword">New Password</label>

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                >
            </div>


            <div class="input-group">
                <label for="confirmNewPassword">Confirm New Password</label>

                <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm new password"
                        required
                >
            </div>


            <button type="submit" class="login-submit">
                Reset Password
            </button>

        </form>

    </div>

</section>


<footer>

    <h2>Fit<span>X</span></h2>

    <p>
        Train Hard. Stay Strong. Live Better.
    </p>

    <p class="copyright">
        ©️ 2026 FitX. All Rights Reserved.
    </p>

</footer>
<script>
    document.getElementById("resetPasswordForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const newPassword = document.getElementById("newPassword").value;
        const confirmNewPassword = document.getElementById("confirmNewPassword").value;

        if (newPassword !== confirmNewPassword) {
            alert("Passwords do not match!");
            return;
        }

        localStorage.setItem("fitxPassword", newPassword);

        alert("Password reset successfully!");

        window.location.href = "login.html";
    });
</script>

</body>
</html>
