<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitX - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navigation -->
<nav>
    <h2 class="logo">
        Fit<span>X</span>
    </h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="workouts.html">Workouts</a>
        <a href="diet-plans.html">Diet Plans</a>
        <a href="membership.html">Membership</a>
    </div>

    <button class="login-btn">Login</button>
</nav>


<!-- Login Section -->
<section class="login-section">

    <div class="login-box">

        <p class="small-title">WELCOME BACK</p>

        <h1>Login to <span>FitX</span></h1>

        <p class="login-subtitle">
            Continue your fitness journey.
        </p>


        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                >
            </div>


            <div class="input-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                >
            </div>


            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="reset-password.html" id="forgotPassword">Forgot Password?</a>

            </div>


            <button type="submit" class="login-submit">
                Login
            </button>

        </form>


        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

    </div>

</section>


<!-- Footer -->
<footer>

    <h2>Fit<span>X</span></h2>

    <p>
        Train Hard. Stay Strong. Live Better.
    </p>

    <p class="copyright">
        © 2026 FitX. All Rights Reserved.
    </p>

</footer>
<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const savedEmail = localStorage.getItem("fitxEmail");
        const savedPassword = localStorage.getItem("fitxPassword");

        if (email === savedEmail && password === savedPassword) {

            localStorage.setItem("fitxLoggedIn", "true");

            window.location.href = "dashboard.html";

        } else {

            alert("Invalid email or password.");

        }
    });

</script>

</body>
</html>
